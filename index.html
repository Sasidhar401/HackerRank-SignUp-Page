<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up | HackerRank</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet"/>
  <link rel="icon" href="./logo.png" />
  <link rel="stylesheet" href="style.css" />
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container-fluid min-vh-100 d-flex flex-column flex-lg-row p-0">
    
    <!-- Left Side with Video -->
    <div class="left col-lg-7 d-none d-lg-block p-0">
      <video autoplay loop muted playsinline class="w-100 h-100 object-fit-cover">
        <source src="./globe-5fdfa9a0f4.mp4" type="video/mp4">
      </video>
    </div>

    <!-- Right Side Form -->
    <div class="right col-lg-5 d-flex flex-column justify-content-center align-items-center p-4">
      <div class="w-100" style="max-width: 600px; min-height: 100%;">
        <h1 class="mb-1">Join us</h1>
        <h1 class="mb-3">Create a HackerRank account</h1>
        <p class="subtitle mb-4">Be part of a 26 million-strong community of developers</p>
        
        <form class="form mb-3">
          <div class="mb-3">
            <input type="text" class="form-control" placeholder="Full Name" name="name" />
          </div>
          <div class="mb-3">
            <input type="email" class="form-control" placeholder="Email" name="email" />
          </div>
          <div class="mb-3">
            <input type="password" class="form-control" placeholder="Password" name="password" />
          </div>

          <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="agree" required />
            <label class="form-check-label" for="agree">
              I agree to HackerRank's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
            </label>
          </div>

          <button type="submit" id="btn1" class="btn btn-success w-100">Sign Up</button>
        </form>

        <div class="text-center mb-3">or</div>

        <div class="social-buttons text-center">
          <button class="btn btn-outline-dark w-100 mb-2 d-flex align-items-center justify-content-center">
            <img src="download (1).png" alt="Google" style="height: 20px; margin-right: 8px;" />
            Google
          </button>
          <div class="d-flex flex-wrap gap-2 justify-content-between">
            <button class="btn btn-outline-dark flex-fill d-flex align-items-center justify-content-center">
              <img src="download.png" alt="Facebook" style="height: 20px; margin-right: 8px;" />
              Facebook
            </button>
            <button class="btn btn-outline-dark flex-fill d-flex align-items-center justify-content-center">
              <img src="download (2).png" alt="LinkedIn" style="height: 20px; margin-right: 8px;" />
              LinkedIn
            </button>
            <button class="btn btn-outline-dark flex-fill d-flex align-items-center justify-content-center">
              <img src="download (3).png" alt="GitHub" style="height: 20px; margin-right: 8px;" />
              GitHub
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
